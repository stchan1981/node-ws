<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>保护动物</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f9fc;
            color: #333;
        }
        header {
            background: #4caf50;
            padding: 20px;
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }
        .banner {
            width: 100%;
            height: 260px;
            background: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee') center/cover no-repeat;
        }
        .content {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            line-height: 1.8;
        }
        h2 {
            color: #2e7d32;
        }
        .animal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .card p {
            padding: 15px;
            font-size: 15px;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background: #eee;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>保护动物 · 人人有责</header>
    <div class="banner"></div>

    <div class="content">
        <h2>为什么要保护动物？</h2>
        <p>
            野生动物是地球生态系统的重要组成部分，它们与人类一样拥有生存的权利。保护动物不仅是保护自然环境，也是保护人类自己的未来。
        </p>

        <h2>濒危动物展示</h2>
        <div class="animal-grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1552410260-28c1e002b286" alt="大熊猫">
                <p><strong>大熊猫</strong>：我国一级保护动物，现仅存约1800只，主要威胁来自栖息地减少。</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1508672019048-805c876b67e2" alt="东北虎">
                <p><strong>东北虎</strong>：世界上最濒危的大型猫科动物之一，野外数量不足百只。</p>
            </div>
            <div class="card">
                <img src="https://images.unsplash.com/photo-1468717754722-0d5b0a43f950" alt="亚洲象">
                <p><strong>亚洲象</strong>：亚洲最大陆生动物，因象牙贸易与栖息地破坏面临严重威胁。</p>
            </div>
        </div>

        <h2>我们能做什么？</h2>
        <p>
            ✔ 不购买野生动物及相关制品<br>
            ✔ 支持环保公益组织<br>
            ✔ 宣传动物保护知识<br>
            ✔ 从自身做起，减少对自然的破坏
        </p>
    </div>

    <footer>© 2025 保护动物公益页面</footer>
</body>
</html>
